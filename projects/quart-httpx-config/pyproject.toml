[project]
name = "myapp"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "python-dotenv>=1.2.1",
    "quart>=0.20.0",
]

[build-system]
requires = ["uv_build>=0.8.11,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.0.0",
    "pytest-env>=1.2.0",
    "respx>=0.22.0",
    "ruff>=0.14.11",
]

[tool.pytest_env]
BASE_URL = "https://example.com"
TIMEOUT = 40
